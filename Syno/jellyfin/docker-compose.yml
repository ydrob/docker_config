version: "3.9"
services:
  jellyfin:
    image: jellyfin/jellyfin:latest
    container_name: jellyfin
    user: 1026:100
    group_add:
      - "937"
    security_opt:
      - no-new-privileges:true      
    environment:
      TZ: Europe/Minsk
      JELLYFIN_TRANSLITERATOR_ID: ""
      PUID: 1026
      PGID: 100 
    mem_limit: 8G  
    volumes:
      - /volume3/docker/jellyfin/config:/config
      - /volume3/docker/jellyfin/cache:/cache
      - /volume1/storage:/media
    devices:
      - /dev/dri:/dev/dri
    restart: unless-stopped
    network_mode: host
    dns:
      - 9.9.9.9 # Google DNS
      - 8.8.8.8 # Cloudfare DNS