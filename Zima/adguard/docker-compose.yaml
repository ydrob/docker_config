name: adguardhome
services:
  adguardhome:
    image: adguard/adguardhome:latest
    container_name: adguardhome
    volumes:
      -  /DATA/AppData/adguard/config:/opt/adguardhome/conf # app configuration
      -  /DATA/AppData/adguard/data:/opt/adguardhome/work # app working directory
    restart: unless-stopped
    network_mode: host
    environment:
      TZ: Europe/Minsk    