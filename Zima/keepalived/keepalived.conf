global_defs {
    script_user root
    enable_script_security
}

vrrp_script chk_adguard {
    script "/usr/local/bin/check_adguard.sh"
    interval 5
    weight -20
}

vrrp_instance VI_DNS {
    state MASTER
    interface eth0
    virtual_router_id 51
    priority 90
    advert_int 1
    authentication {
        auth_type PASS
        auth_pass WENyvutQ
    }
    unicast_peer {
    192.168.0.15
    }
    virtual_ipaddress {
        192.168.0.100/24
    }
    track_script {
        chk_adguard
    }
}
